name: Test

on:
  pull_request:
    # labeled and unlabeled rerun the release check when hold-release is added or removed.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's merge commit and its first parent, the base branch the release check reads.
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: TypeScript for the adapter tests only
        # Installed outside the checkout: the plugin itself has no npm dependency.
        run: npm install --prefix "$RUNNER_TEMP/ts" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund typescript@6.0.3
      - name: Unit tests
        env:
          PR_GRADE_TYPESCRIPT: ${{ runner.temp }}/ts/node_modules/typescript
          # A missing compiler fails the run instead of skipping the TypeScript tests.
          PR_GRADE_REQUIRE_TS: '1'
        run: python -m unittest discover -s tests -v
      - name: A change that ships raises the version
        # !cancelled() reports a missing release alongside a unit-test failure, not one run later.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          HOLD: ${{ contains(github.event.pull_request.labels.*.name, 'hold-release') }}
        run: |
          if [ "$HOLD" = true ]; then hold=--hold; fi
          python .github/scripts/check_release.py --base HEAD^1 $hold
