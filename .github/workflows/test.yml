name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: TypeScript for the adapter tests only
        # Installed outside the checkout: the plugin itself has no npm dependency.
        run: npm install --prefix "$RUNNER_TEMP/ts" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund typescript@6.0.3
      - name: Unit tests
        env:
          PR_GRADE_TYPESCRIPT: ${{ runner.temp }}/ts/node_modules/typescript
          # A missing compiler fails the run instead of skipping the TypeScript tests.
          PR_GRADE_REQUIRE_TS: '1'
        run: python -m unittest discover -s tests -v
