name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: TypeScript for the adapter tests only
        # Installed outside the checkout: the plugin itself has no npm dependency.
        run: npm install --prefix "$RUNNER_TEMP/ts" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund typescript@6.0.3
      - name: Unit tests
        env:
          PR_GRADE_TYPESCRIPT: ${{ runner.temp }}/ts/node_modules/typescript
          # A missing compiler fails the run instead of skipping the TypeScript tests.
          PR_GRADE_REQUIRE_TS: '1'
        run: python -m unittest discover -s tests -v
